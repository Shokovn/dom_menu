<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Khóa học JavaScript</title>
</head>

<body>
    <h1 id="main-title">Tiêu đề cũ</h1>
    <p class="description">Mô tả cũ</p>
    <input type="text" id="student-name" placeholder="Nhập tên học viên">
    <button id="greet-btn">Chào</button>

    <p id="greeting"></p>

    <script>
        const title = document.getElementById("main-title");
        title.innerText = "Chào mừng bạn đến với khóa học JavaScript!";

        const desc = document.querySelector(".description");
        desc.innerHTML = 'Bạn sẽ học về <strong>DOM, Events</strong>';

        const btn = document.getElementById("greet-btn");
        const input = document.getElementById("student-name");
        const greeting = document.getElementById("greeting");

        btn.addEventListener("click", function() {
            const name = input.value.trim();
            if (name !== "") {
                greeting.innerText = `Xin chào, ${name}!`;
            } else {
                greeting.innerText = "";
            }
        });
    </script>

</body>

</html>
